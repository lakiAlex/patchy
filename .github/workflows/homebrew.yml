name: Homebrew

# When a release is published, sets the new version and the DMG's checksum in
# the cask in lakiAlex/homebrew-tap. TAP_DEPLOY_KEY is a deploy key with write
# access to that repository. Run it by hand with a tag to redo a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, like v1.0.0
        required: true

jobs:
  cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Download the DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*_universal.dmg' --dir dmg
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum dmg/*.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: lakiAlex/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the cask
        working-directory: tap
        run: |
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/patchy.rb
          if git diff --quiet; then
            echo "Casks/patchy.rb already has Patchy $VERSION"
            exit 0
          fi
          git config user.name "Lazar Momcilovic"
          git config user.email "lakialekscs@gmail.com"
          git commit -am "Patchy $VERSION"
          git push
