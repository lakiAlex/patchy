[package]
name = "patchy"
version = "1.0.4"
description = "Security dashboard: CVEs, advisories and patches for the stack I work with"
authors = []
edition = "2024"

# The program file is named like the app, so the Dock shows "Patchy" in development too.
[[bin]]
name = "Patchy"
path = "src/main.rs"

[lib]
name = "patchy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "gzip"] }
thiserror = "2.0.21"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-aptabase = "1.3"
